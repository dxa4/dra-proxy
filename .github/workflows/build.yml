name: Build & Release Proxy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact: x5-proxy-win.exe
          - os: macos-13
            artifact: x5-proxy-macos-x64
          - os: macos-latest
            artifact: x5-proxy-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build SEA (macOS / Linux)
        if: runner.os != 'Windows'
        run: |
          echo '{"main":"local.js","output":"sea-prep.blob","disableExperimentalSEAWarning":true}' > sea-config.json
          node --experimental-sea-config sea-config.json
          cp $(node -e "process.stdout.write(process.execPath)") ${{ matrix.artifact }}
          codesign --remove-signature ${{ matrix.artifact }} || true
          npx postject ${{ matrix.artifact }} NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2 --macho-segment-name NODE_SEA
          codesign --sign - ${{ matrix.artifact }} || true

      - name: Build SEA (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          '{"main":"local.js","output":"sea-prep.blob","disableExperimentalSEAWarning":true}' | Out-File sea-config.json
          node --experimental-sea-config sea-config.json
          Copy-Item (node -e "process.stdout.write(process.execPath)") x5-proxy-win.exe
          npx postject x5-proxy-win.exe NODE_SEA_BLOB sea-prep.blob --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
