name: Build & Release Proxy

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: node20-win-x64
            artifact: x5-proxy-win.exe
          - os: macos-latest
            target: node20-macos-x64
            artifact: x5-proxy-macos-x64
          - os: macos-latest
            target: node20-macos-arm64
            artifact: x5-proxy-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pkg
        run: npm install -g @yao-pkg/pkg

      - name: Build binary
        run: pkg local.js --target ${{ matrix.target }} --output ${{ matrix.artifact }} --compress GZip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
